user  www-data;
worker_processes  auto;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;
error_log  /var/log/nginx/error.log  notice;

#pid        logs/nginx.pid;

worker_rlimit_nofile 65535;
worker_shutdown_timeout 15m;
events {
    worker_connections  65535;
}


http {
    include mime.types;
    default_type application/octet-stream;
    real_ip_header X-Real-IP;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }
    # registry_proxy.lua 与 nginx.conf 同目录（$prefix/conf/）。
    # 用 $prefix 而不是写死路径：它跟随 openresty -p 参数，换部署路径无需改这里。
    lua_package_path '$prefix/conf/?.lua;/usr/local/luajit/lib/lua/?.lua;;';

    # === docker registry proxy 用到的东西 ===
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;   # 换成你机器能用的 DNS
    resolver_timeout 5s;

    # 上游 realm/service 探测结果缓存（含失败的负缓存）。
    # 注意：这里不再有 token_cache —— 鉴权改为透明式，
    # token 由客户端持有，服务端不缓存任何 bearer token。
    lua_shared_dict auth_discovery 2m;

    # Registry API 按客户端 IP 共用一套限速计数。
    # 10m 大约可容纳 16 万个 IPv4 地址（IPv6 条目占用略高）。
    # $binary_remote_addr 比文本 IP 更省共享内存；所有 worker 共享这两个 zone。
    limit_req_zone  $binary_remote_addr zone=registry_rps:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=registry_conn:10m;
    limit_req_log_level  warn;
    limit_conn_log_level warn;
    limit_req_status  429;
    limit_conn_status 429;

    lua_socket_log_errors on;    # cosocket 错误要能看到（discover/auth 全靠它）
    lua_ssl_verify_depth 5;      # 留出跨签名 4 层链的余量
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;

    init_worker_by_lua_block {
        require("registry_proxy").init_worker()
    }

    log_format main escape=json '{"@timestamp":"$time_iso8601","client_addr":"$remote_addr","client_port":"$remote_port","xff":"$http_x_forwarded_for",'
           '"server_addr":"$server_addr","server_port":"$server_port","hostname":"$hostname","protocol":"$ssl_protocol $server_protocol",'
           '"scheme":"$scheme","host":"$host","uri":"$uri","request_time":"$request_time",'
           '"status":"$status","completion":"$request_completion","body_bytes":"$body_bytes_sent","clength":"$content_length","upstream_cache":"$upstream_cache_status","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
            '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent",'
           '"upstream_bytes_received": "$upstream_bytes_received", "upstream_bytes_sent": "$upstream_bytes_sent", "upstream_connect_time": "$upstream_connect_time", "upstream_header_time":"$upstream_header_time",'
           '"method":"$request_method","url":"$scheme://$host$request_uri","rerfer":"$http_referer","request_length":"$request_length"'
           '}';
    access_log /var/log/nginx/access.log  main;

    http2 on;
    server_tokens off;
    proxy_http_version 1.1;
    client_max_body_size 200m;
    client_body_buffer_size 1024k;
    underscores_in_headers on;
    ignore_invalid_headers off;
    
    sendfile        on;
    tcp_nopush      on;
    #keepalive_timeout      0;
    keepalive_timeout  600;
    
    proxy_temp_path /var/log/nginx/proxy_temp;
    proxy_cache_path /var/log/nginx/proxy_cache levels=1:2 keys_zone=cache_one:100m inactive=10m max_size=1g;
    proxy_cache_path /var/log/nginx/static_cache levels=1:2 keys_zone=static_cache:100m inactive=1h max_size=5g;
    client_body_temp_path /var/log/nginx/client_body_temp;
    
    gzip  on;
    gzip_min_length  1k;
    gzip_buffers  4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;
    gzip_vary on;
    client_header_buffer_size 8k;
    large_client_header_buffers 8 16k;
    proxy_buffer_size 1024k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 1024k;
    server_names_hash_bucket_size 256;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
    
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name ~^(?<subdomain>.+)\.example\.com$;
    
        ssl_certificate     cert/ssl.crt;
        ssl_certificate_key cert/ssl.key;
        ssl_dhparam         cert/ssl.dhparam;
        
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 SSLv3 TLSv1.3;
        ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4:@SECLEVEL=0";
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
    
        add_header Access-Control-Allow-Origin   "https://example.com" always;
        add_header Access-Control-Allow-Methods  "OPTIONS, GET, POST, PUT, PATCH" always;
        add_header Access-Control-Allow-Headers  "Origin, Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age        100 always;
        add_header Vary                          "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # === docker registry proxy：独立子域名入口 + cr.example.com 统一入口
        #     docker.example.com、ghcr.example.com 等按 subdomain 选择上游；
        #     cr.example.com 默认代理 Docker Hub，也支持 /v2/ghcr.io/...、
        #     /v2/quay.io/... 等路径选择器，具体映射由 registry_proxy.lua 决定。
        #     鉴权模型为透明式：上游要鉴权时我们回自己的 401，realm 指向本站 /v2/auth，
        #     客户端来换 token 后自带 Authorization，我们原样转发不碰它。
        #     blob 的 307/302 由 @follow 在服务端跟随，客户端全程只与本站通信。
        #     命中的 subdomain 由 registry_proxy.lua 里的 REGISTRIES 表决定，
        #     cr 的路径选择器由同文件的 CR_SELECTORS 表决定。

        # 多跳跟随（registry -> CDN -> 区域节点）必须开这个，
        # 否则第二跳的 302 会被原样吐给客户端。
        recursive_error_pages on;

        # ---- 根路径：registry subdomain 跳 /v2/，其他 subdomain 走静态站点 ----
        location = / {
            access_by_lua_block {
                require("registry_proxy").root_redirect()
            }
            index index.html index.htm;
        }

        # ---- token 中转：纯 Lua，不代理，不挂 fix_response，不设 error_page ----
        location = /v2/auth {
            default_type application/json;
            gzip off;

            # 恶意刷 /v2/auth 会打爆 token 探测，必须纳入限速。
            # 无需手动维护 connection 计数（limit_conn 对 content-by-lua 同样生效，
            # 但那类请求转瞬即逝）；最需要防的是频率刷。
            # 用户代理真实登录是低频（docker login 只触发一次），不影响。
            limit_req zone=registry_rps burst=100 nodelay;
            limit_conn registry_conn 32;
            error_page 429 = @ratelimited;

            content_by_lua_block {
                require("registry_proxy").auth()
            }
        }

        # ---- /v2 无斜杠：规范化，避免 ^~ /v2 误吞 /v2abc ----
        location = /v2 {
            return 301 https://$host/v2/;
        }

        # ---- registry API 转发 ----
        location ^~ /v2/ {
            set $upstream_url  '';
            set $reg_upstream  '';
            set $follow_hops   '0';   # @follow 里不能再 set，否则每跳重置

            # 按客户端 IP 限速。与 /v2/auth 共用同一 zone，
            # 所以刷 auth 和刷 manifests 合并计入同一份配额。
            #
            # burst=100 nodelay：超出 20r/s 的部分立即放行（不排队），
            # 只有连 burst 桶都装满才 429。docker pull 大镜像会瞬间并发几十个
            # blob 请求，nodelay 让它们直接过，而不是被 limit_req 人为拖慢到 50ms/个。
            # 去掉 nodelay 会把正常拉取的层串行化，pull 速度断崖下跌。
            limit_req  zone=registry_rps burst=100 nodelay;
            limit_conn registry_conn 32;

            access_by_lua_block {
                require("registry_proxy").route()
            }
            header_filter_by_lua_block {
                require("registry_proxy").fix_response()
            }

            # 镜像层已是压缩数据，再压无收益；且任何 body 变换都会破坏
            # Docker-Content-Digest 契约。全局 gzip_types 含 application/json，必须关掉。
            gzip off;

            # 全局是 1024k。proxy_buffering off 时它是【每个在途请求】的 recv 缓冲，
            # 配合 worker_connections 65535，千级并发拉层会吃掉 1GB 内存。
            proxy_buffer_size 32k;

            # 大体积 blob 必须流式，不落盘
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_ssl_server_name on;
            proxy_redirect off;

            # 拦截上游 3xx 交给 @follow 在服务端跟随。
            #  1. 裸 "=" 是必须的。没有它 err_status 保持 307，
            #     客户端会收到「307 状态 + CDN 响应体」的错乱响应。
            #  2. 不要列 301。ngx.redirect(url, 301) 也会被 error_page 301 吞进 @follow。
            #     registry 的 blob 只用 307/302。
            # 另外：在 location 里写任意一条 error_page 会【整体替换】从 server 块继承来的
            # `error_page 400 401 403 404 405 /40x.html;`。这正是我们要的 ——
            # 否则上游的 401/404 会被换成静态 HTML 页，registry 的 JSON 错误体丢失，
            # 且 HEAD manifests 的正常 404 探测会坏掉。
            proxy_intercept_errors on;
            error_page 302 307 308 = @follow;
            error_page 429 = @ratelimited;

            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            proxy_pass $upstream_url;
        }

        # 限速命中时返回 Docker Registry 风格 JSON。
        # 命名 location 内直接发送响应，避免再次触发 error_page。
        location @ratelimited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"errors":[{"code":"TOOMANYREQUESTS","message":"rate limit exceeded","detail":"retry after 1 second"}]}';
        }

        # ---- 服务端跟随 blob 重定向（命名 location，外部不可直达）----
        location @follow {
            set $follow_url '';

            # 必须在 rewrite 阶段读 $upstream_http_location：
            # content 阶段 r->upstream 已被清零，读出来是空串 -> 500
            rewrite_by_lua_block {
                require("registry_proxy").prepare_follow()
            }

            # -- 以下 proxy 参数需与 ^~ /v2/ 保持一致，改动请同步两处 --
            gzip off;
            proxy_buffer_size 32k;

            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # 命名 location 不继承兄弟 location 的设置，且此项默认为 off。
            # 缺了它对 Cloudflare / Fastly 这类多租户 CDN 会握手失败或拿到错证书。
            proxy_ssl_server_name on;

            proxy_redirect off;

            # CDN 可能再跳一次（区域节点），需要继续拦截；
            # 同时这条也顶掉了从 server 块继承来的 error_page 40x/50x。
            proxy_intercept_errors on;
            error_page 302 307 308 = @follow;

            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # 预签名 URL（S3 SigV4 / Azure SAS）同时带 Authorization 头会被拒，
            # 且会把有效的 registry 凭据泄露给第三方 CDN 主机。必须清掉。
            proxy_set_header  Authorization "";
            proxy_set_header  Cookie        "";
            proxy_hide_header Set-Cookie;

            # Host 与 proxy_ssl_name 默认取 $proxy_host（从完整 URL 求值而来）
            # = CDN 主机名，正是我们要的。不要手动覆盖。

            proxy_pass $follow_url;
        }

        root html;

        location / {
            index  index.html index.htm;
        }

        error_page 400 401 403 404 405 /40x.html;
        location = /40x.html { internal; }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { internal; }
    }
}
