# ============================================================
# 容器镜像仓库反向代理
# registry 业务逻辑在同目录 registry_proxy.lua；本文件只做接线与调优。
# ============================================================

user                     www-data;
worker_processes         auto;
worker_rlimit_nofile     65535;
worker_shutdown_timeout  15m;    # 优雅退出留足时间：blob 传输 read_timeout 达 600s

error_log  /var/log/nginx/error.log  notice;

events {
    worker_connections  65535;
}

http {
    # ---------- 基础 ----------
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    http2         on;

    # ---------- 真实客户端 IP ----------
    # 仅在前置了 CDN / 负载均衡时需要：必须用 set_real_ip_from 声明可信回源网段，
    # 否则限速与日志里所有客户端都会塌缩成 LB 的 IP，共用同一份限速配额。
    # 若本服务直连公网，可删除这两行。
    real_ip_header    X-Real-IP;
    real_ip_recursive on;
    # set_real_ip_from 10.0.0.0/8;        # ← 换成你的 LB/CDN 回源网段
    # set_real_ip_from 173.245.48.0/20;   # ← Cloudflare 示例，完整列表见其官网

    # ---------- Lua ----------
    # registry_proxy.lua 与本文件同目录（$prefix/conf/）。用 $prefix 而非写死路径，
    # 跟随 openresty -p 参数，换部署路径无需改这里。
    lua_package_path            '$prefix/conf/?.lua;/usr/local/luajit/lib/lua/?.lua;;';
    lua_socket_log_errors       on;    # cosocket 错误要能看到（discover/auth 全靠它）
    lua_ssl_verify_depth        5;     # 留出跨签名 4 层链的余量
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # 上游 realm/service 探测结果缓存（含失败的负缓存）。
    # 鉴权为透明式：token 由客户端持有，服务端不缓存任何 bearer token，故无 token_cache。
    lua_shared_dict auth_discovery 2m;

    init_worker_by_lua_block {
        require("registry_proxy").init_worker()
    }

    # ---------- 上游解析与证书校验 ----------
    resolver         1.1.1.1 8.8.8.8 valid=30s ipv6=off;   # 换成你机器能用的 DNS
    resolver_timeout 5s;

    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify              on;

    # ---------- 限速（按客户端 IP，/v2/ 与 /v2/auth 共用一套计数）----------
    # $binary_remote_addr 比文本 IP 省内存；10m 约可容纳 16 万个 IPv4 条目。
    limit_req_zone  $binary_remote_addr zone=registry_rps:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=registry_conn:10m;
    limit_req_log_level  warn;
    limit_conn_log_level warn;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------- 连接 / 超时 / 请求头 ----------
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  600;
    proxy_http_version 1.1;

    client_max_body_size        200m;   # 全局默认；/v2/ 覆盖为 0 以放开 docker push 大层
    client_header_buffer_size   8k;      # registry 的 JWT bearer 头可能较大
    large_client_header_buffers 8 16k;

    # ---------- 日志 ----------
    log_format main escape=json
        '{"@timestamp":"$time_iso8601","client_addr":"$remote_addr","client_port":"$remote_port","xff":"$http_x_forwarded_for",'
        '"server_addr":"$server_addr","server_port":"$server_port","hostname":"$hostname","protocol":"$ssl_protocol $server_protocol",'
        '"scheme":"$scheme","host":"$host","uri":"$uri","request_time":"$request_time",'
        '"status":"$status","completion":"$request_completion","body_bytes":"$body_bytes_sent","clength":"$content_length","upstream_cache":"$upstream_cache_status","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent",'
        '"upstream_bytes_received":"$upstream_bytes_received","upstream_bytes_sent":"$upstream_bytes_sent","upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time",'
        '"method":"$request_method","url":"$scheme://$host$request_uri","referer":"$http_referer","request_length":"$request_length"'
        '}';
    access_log /var/log/nginx/access.log main;

    # ---------- gzip（仅作用于静态站点；/v2/、/v2/auth、@follow 已各自关闭）----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   4;
    gzip_buffers      4 16k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml application/xml+rss;

    # ============================================================
    # :80 —— 全部 301 到 https
    # ============================================================
    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # :443 —— registry 代理主入口
    #   docker.example.com / ghcr.example.com … 按 subdomain 选上游；
    #   cr.example.com 默认走 Docker Hub，并支持 /v2/ghcr.io/… 等路径选择器。
    #   映射由 registry_proxy.lua 的 REGISTRIES / CR_SELECTORS 表决定。
    #
    #   鉴权透明式：上游要鉴权时回本站 401，realm 指向 /v2/auth，客户端换 token 后
    #   自带 Authorization，我们原样转发不碰它；blob 的 307/302 由 @follow 服务端跟随。
    # ============================================================
    server {
        listen      443 ssl;
        listen [::]:443 ssl;
        server_name ~^(?<subdomain>.+)\.example\.com$;

        # ---- TLS ----
        ssl_certificate     cert/ssl.crt;
        ssl_certificate_key cert/ssl.key;

        # 只保留 TLS 1.2/1.3：SSLv3 / TLSv1 / TLSv1.1 已被 POODLE、BEAST 等攻破，
        # @SECLEVEL=0 + 3DES 也不该出现。所有 docker/containerd 客户端都支持 TLS1.2+。
        ssl_protocols TLSv1.2 TLSv1.3;
        # 纯 ECDHE 套件（已去掉 DHE，因此不再需要 ssl_dhparam）；
        # TLS1.3 套件由 OpenSSL 自动选择，无需列出。
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---- 安全响应头 ----
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # 多跳跟随（registry -> CDN -> 区域节点）必须开：否则第二跳的 302 会被原样吐给客户端。
        recursive_error_pages on;

        # ---- 根路径：registry subdomain 跳 /v2/，其他 subdomain 走静态站点 ----
        location = / {
            access_by_lua_block {
                require("registry_proxy").root_redirect()
            }
            index index.html index.htm;
        }

        # ---- token 中转：纯 Lua，不代理，不挂 fix_response，不设 error_page ----
        location = /v2/auth {
            default_type application/json;
            gzip off;

            # 恶意刷 /v2/auth 会打爆 token 探测，必须纳入限速。
            # 真实 docker login 是低频操作，不受影响。
            limit_req  zone=registry_rps burst=100 nodelay;
            limit_conn registry_conn 32;
            error_page 429 = @ratelimited;

            content_by_lua_block {
                require("registry_proxy").auth()
            }
        }

        # ---- /v2 无斜杠：规范化，避免 ^~ /v2 误吞 /v2abc ----
        location = /v2 {
            return 301 https://$host/v2/;
        }

        # ---- registry API 转发 ----
        location ^~ /v2/ {
            set $upstream_url  '';
            set $reg_upstream  '';
            set $follow_hops   '0';   # @follow 里不能再 set，否则每跳重置

            # burst=100 nodelay：docker pull 大镜像会瞬间并发几十个 blob 请求，
            # nodelay 让超出 20r/s 的部分立即放行而非排队，避免把拉取串行化拖慢。
            limit_req  zone=registry_rps burst=100 nodelay;
            limit_conn registry_conn 32;

            access_by_lua_block {
                require("registry_proxy").route()
            }
            header_filter_by_lua_block {
                require("registry_proxy").fix_response()
            }

            # 镜像层已是压缩数据，再压无收益；且任何 body 变换都会破坏
            # Docker-Content-Digest 契约。全局 gzip_types 含 application/json，必须关掉。
            gzip off;

            # proxy_buffering off 时 proxy_buffer_size 是【每个在途请求】的 recv 缓冲；
            # 配合 6.5w 连接，千级并发拉层若用大值会吃光内存，这里收到 32k。
            # proxy_buffers 在 buffering off 下不参与实际收发，但 nginx 仍会用它校验派生的
            # proxy_busy_buffers_size：默认 8 4k 与 32k 不自洽会报 emerg，故显式给 4 32k。
            proxy_buffer_size 32k;
            proxy_buffers     4 32k;

            # 大体积 blob 必须流式，不落盘
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;

            # 全局 200m 会挡掉 docker push 大层（基础/ML 镜像单层常 >200MB）。
            # 已 proxy_request_buffering off 流式转发，这里放开交给上游判定；GET 不受影响。
            client_max_body_size 0;

            proxy_set_header      Connection "";
            proxy_ssl_server_name on;
            proxy_redirect        off;

            # 拦截上游 3xx 交给 @follow 服务端跟随。
            #  1. 裸 "=" 必须有：否则 err_status 保持 307，客户端收到「307 + CDN 响应体」的错乱响应。
            #  2. 不要列 301：ngx.redirect(url, 301) 也会被吞进 @follow。registry blob 只用 307/302。
            # 注意：在 location 里写任意 error_page 会【整体替换】继承来的 40x 页 —— 这正是我们要的，
            # 否则上游 401/404 的 JSON 错误体会被换成静态 HTML，HEAD manifests 的正常 404 探测也会坏。
            proxy_intercept_errors on;
            error_page 302 307 308 = @follow;
            error_page 429         = @ratelimited;

            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # 注意：不碰 Authorization，也不设 Host。Host 由 proxy_pass 完整 URL 的 $proxy_host 决定。
            proxy_pass $upstream_url;
        }

        # ---- 服务端跟随 blob 重定向（命名 location，外部不可直达）----
        # 参数需与 ^~ /v2/ 保持一致，改动请同步两处。
        location @follow {
            set $follow_url '';

            # 必须在 rewrite 阶段读 $upstream_http_location：
            # content 阶段 r->upstream 已被清零，读出来是空串 -> 500。
            rewrite_by_lua_block {
                require("registry_proxy").prepare_follow()
            }

            gzip off;
            proxy_buffer_size        32k;
            proxy_buffers            4 32k;   # 同 ^~ /v2/：与 proxy_buffer_size 自洽，避免 busy 校验报错
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;

            proxy_set_header      Connection "";
            # 命名 location 不继承兄弟 location 的设置，此项默认 off；缺了它对
            # Cloudflare / Fastly 这类多租户 CDN 会握手失败或拿到错证书。
            proxy_ssl_server_name on;
            proxy_redirect        off;

            # CDN 可能再跳一次（区域节点），继续拦截；同时顶掉继承来的 40x/50x error_page。
            proxy_intercept_errors on;
            error_page 302 307 308 = @follow;

            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # 预签名 URL（S3 SigV4 / Azure SAS）带 Authorization 会被拒，且会把 registry
            # 凭据泄露给第三方 CDN。必须清掉。Host/proxy_ssl_name 默认取 $proxy_host = CDN 主机，勿覆盖。
            proxy_set_header  Authorization "";
            proxy_set_header  Cookie        "";
            proxy_hide_header Set-Cookie;

            proxy_pass $follow_url;
        }

        # ---- 限速命中：返回 Docker Registry 风格 JSON（命名 location，避免再触发 error_page）----
        location @ratelimited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"errors":[{"code":"TOOMANYREQUESTS","message":"rate limit exceeded","detail":"retry after 1 second"}]}';
        }

        # ---- 静态回落站点（非 registry 子域名 / 根路径）----
        root html;
        location / {
            index index.html index.htm;
        }

        error_page 400 401 403 404 405 /40x.html;
        location = /40x.html { internal; }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { internal; }
    }
}
